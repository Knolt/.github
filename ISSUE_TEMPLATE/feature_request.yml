name: Feature or use case
description: Propose a new capability or a new incident Knolt should catch.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this, and what goes wrong today without it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What done looks like
      description: What a reviewer or operator should see when it works.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - New incident or scene to detect
        - Search or questions
        - Reviewer workflow
        - Deployment or hardware
        - Other
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and review
      description: Does this touch identity, retention or what leaves the building? How does a person stay in the loop?
